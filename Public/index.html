<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MADA LUCKY INTERNATIONAL - Wallet Admin</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#101827;
 color:white;
}
header{
 background:#172b49;
 padding:22px 15px;
 text-align:center;
 border-bottom:2px solid #d9a928;
}
header h2{color:#f3c64e;margin:0}
header p{color:#b8c6d9}
main{padding:18px;max-width:950px;margin:auto}
.card{
 background:#1c2b42;
 padding:18px;
 margin-bottom:16px;
 border-radius:12px;
}
h3{color:#f3c64e;margin-top:0}
.network{
 background:#263952;
 padding:15px;
 margin:12px 0;
 border-radius:9px;
}
label{display:block;margin:10px 0 6px}
input,select{
 width:100%;
 padding:12px;
 border:0;
 border-radius:6px;
 background:#edf1f7;
 color:#17233d;
}
button{
 padding:12px 18px;
 border:0;
 border-radius:6px;
 background:#d9a928;
 color:#17233d;
 font-weight:bold;
 margin-top:12px;
}
.note{color:#aebed1;font-size:13px}
</style>
</head>

<body>

<header>
<h2>🌍 MADA LUCKY INTERNATIONAL</h2>
<p>WALLET ADMINISTRATIF</p>
</header>

<main>

<div class="card">
<h3>💼 Tableau de bord</h3>
<p>Gestion des adresses de réception crypto</p>
<p class="note">Administration centrale de la plateforme</p>
</div>

<div class="card">
<h3>₿ CRYPTO WALLET</h3>
<div id="networks"></div>
</div>

<div class="card">
<h3>⚙️ Configuration</h3>
<label>Devise principale</label>
<select>
<option>USD</option>
</select>
<p class="note">
Les adresses de réception doivent être vérifiées
avant leur activation.
</p>
</div>

</main>

<script>
const networks = [
"T.BEP20 - USD",
"T.TRC20 - USD",
"BNB",
"TRX",
"S.BEP20 - USD",
"T.POLYGON - USD",
"T.ETH - USD",
"S.POLYGON - USD",
"S.ETH - USD",
"ETH",
"POLYGON",
"ETH - PYUSD"
];

const container = document.getElementById("networks");

networks.forEach((name,index)=>{
 const box=document.createElement("div");
 box.className="network";
 box.innerHTML=`
 <h3>${index+1}. ${name}</h3>
 <label>Adresse de réception</label>
 <input type="text"
 placeholder="Adresse publique ${name}">
 <label>Statut</label>
 <select>
 <option>En attente de configuration</option>
 <option>Activé</option>
 <option>Désactivé</option>
 </select>
 `;
 container.appendChild(box);
});
</script>

</body>
</html>
