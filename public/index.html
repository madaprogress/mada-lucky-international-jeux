<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MADA LUCKY INTERNATIONAL - Wallet Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101827;color:white}
header{background:#172b49;padding:22px 15px;text-align:center;border-bottom:2px solid #d9a928}
header h2{color:#f3c64e;margin:0}
header p{color:#b8c6d9}
main{padding:18px;max-width:950px;margin:auto}
.card{background:#1c2b42;padding:18px;margin-bottom:16px;border-radius:12px}
h3{color:#f3c64e;margin-top:0}
.network{background:#263952;padding:15px;margin:12px 0;border-radius:9px}
label{display:block;margin:10px 0 6px}
input,select{width:100%;padding:12px;border:0;border-radius:6px;background:#edf1f7;color:#17233d}
button{padding:12px 18px;border:0;border-radius:6px;background:#d9a928;color:#17233d;font-weight:bold;margin-top:12px}
.note{color:#aebed1;font-size:13px}
.save-btn{width:100%;background:#22c55e;color:white;font-size:16px;padding:15px}
#message{font-weight:bold;overflow-wrap:anywhere}
</style>
</head>

<body>

<header>
<h2>🌍 MADA LUCKY INTERNATIONAL</h2>
<p>WALLET ADMINISTRATIF</p>
</header>

<main>

<div class="card">
<h3>💼 Tableau de bord</h3>
<p>Gestion des adresses de réception crypto</p>
<p class="note">Administration centrale de la plateforme</p>
<p id="connection">Connexion au serveur...</p>
</div>

<div class="card">
<h3>₿ CRYPTO WALLET</h3>

<div id="networks"></div>

<button class="save-btn" onclick="sauvegarder()">
💾 SAUVEGARDER TOUTES LES ADRESSES
</button>

<p id="message"></p>
</div>

<div class="card">
<h3>⚙️ Configuration</h3>
<label>Devise principale</label>
<select disabled>
<option>USD</option>
</select>
<p class="note">
Les adresses de réception doivent être vérifiées avant leur activation.
</p>
</div>

</main>

<script>
const networks = [
"T.BEP20 - USD",
"T.TRC20 - USD",
"BNB",
"TRX",
"S.BEP20 - USD",
"T.POLYGON - USD",
"T.ETH - USD",
"S.POLYGON - USD",
"S.ETH - USD",
"ETH",
"POLYGON",
"ETH - PYUSD"
];

const statuses = [
"En attente de configuration",
"Activé",
"Désactivé"
];

const container = document.getElementById("networks");
let adminPassword = "";

function afficherWallets(data) {
  container.innerHTML = "";

  data.forEach((wallet, index) => {
    const box = document.createElement("div");
    box.className = "network";
    box.dataset.network = wallet.network_name;

    const title = document.createElement("h3");
    title.textContent = (index + 1) + ". " + wallet.network_name;

    const label1 = document.createElement("label");
    label1.textContent = "Adresse de réception";

    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Adresse publique " + wallet.network_name;
    input.value = wallet.wallet_address || "";

    const label2 = document.createElement("label");
    label2.textContent = "Statut";

    const select = document.createElement("select");

    statuses.forEach(status => {
      const option = document.createElement("option");
      option.value = status;
      option.textContent = status;
      select.appendChild(option);
    });

    select.value = wallet.status;

    box.appendChild(title);
    box.appendChild(label1);
    box.appendChild(input);
    box.appendChild(label2);
    box.appendChild(select);

    container.appendChild(box);
  });
}

async function chargerWallets() {

  adminPassword = prompt("Mot de passe administrateur :");

  if (!adminPassword) {
    document.getElementById("message").textContent =
      "Accès annulé.";
    document.getElementById("connection").textContent =
      "Non connecté.";
    return;
  }

  try {
    const response = await fetch("/api/admin/wallets", {
      headers: {
        "x-admin-password": adminPassword
      }
    });

    if (!response.ok) {
      throw new Error("Accès refusé");
    }

    const data = await response.json();

    afficherWallets(data);

    document.getElementById("connection").textContent =
      "🟢 Connecté au serveur";

    document.getElementById("message").textContent =
      "Wallet chargé avec succès.";

  } catch (error) {
    document.getElementById("connection").textContent =
      "🔴 Connexion impossible";

    document.getElementById("message").textContent =
      "Mot de passe incorrect ou erreur serveur.";
  }
}

async function sauvegarder() {

  if (!adminPassword) {
    alert("Veuillez vous connecter comme administrateur.");
    return;
  }

  const wallets = [];

  document.querySelectorAll(".network").forEach(box => {
    wallets.push({
      network_name: box.dataset.network,
      wallet_address: box.querySelector("input").value,
      status: box.querySelector("select").value
    });
  });

  try {
    document.getElementById("message").textContent =
      "Sauvegarde en cours...";

    const response = await fetch("/api/admin/wallets", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "x-admin-password": adminPassword
      },
      body: JSON.stringify({
        wallets: wallets
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Erreur");
    }

    document.getElementById("message").textContent =
      "✅ Adresses sauvegardées dans PostgreSQL !";

  } catch (error) {
    document.getElementById("message").textContent =
      "❌ Erreur de sauvegarde : " + error.message;
  }
}

chargerWallets();
</script>

</body>
</html>
