
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MADA LUCKY INTERNATIONAL</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101827;color:white}
header{background:#172b49;padding:22px 15px;text-align:center;border-bottom:2px solid #d9a928}
header h2{color:#f3c64e;margin:0}
header p{color:#b8c6d9}
.tabs{display:flex;max-width:950px;margin:15px auto 0;gap:10px;padding:0 18px}
.tabs button{flex:1;padding:14px;border:0;border-radius:8px;background:#263952;color:white;font-weight:bold;cursor:pointer}
.tabs button.active{background:#d9a928;color:#17233d}
main{padding:18px;max-width:950px;margin:auto}
.card{background:#1c2b42;padding:18px;margin-bottom:16px;border-radius:12px}
h3{color:#f3c64e;margin-top:0}
.network{background:#263952;padding:15px;margin:12px 0;border-radius:9px}
label{display:block;margin:10px 0 6px}
input,select{width:100%;padding:12px;border:0;border-radius:6px;background:#edf1f7;color:#17233d}
button{padding:12px 18px;border:0;border-radius:6px;background:#d9a928;color:#17233d;font-weight:bold;margin-top:12px;cursor:pointer}
.note{color:#aebed1;font-size:13px}
.save-btn{width:100%;background:#22c55e;color:white;font-size:16px;padding:15px}
#message{font-weight:bold;overflow-wrap:anywhere}
.hidden{display:none}
.num-box{background:#0f1a2e;border:1px solid #d9a928;padding:14px;border-radius:8px;margin-top:10px;word-break:break-all}
.num-box b{color:#f3c64e}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.grid button{background:#263952;color:white;padding:10px 0;margin:0}
.grid button.sel{background:#d9a928;color:#17233d}
</style>
</head>
<body>
<header>
<h2>🌍 MADA LUCKY INTERNATIONAL</h2>
<p id="topInfo">Connexion au serveur...</p>
</header>

<div class="tabs">
<button id="tabJoueur" class="active" onclick="showTab('joueur')">🎮 JOUEUR</button>
<button id="tabAdmin" onclick="showTab('admin')">🔐 ADMIN</button>
</div>

    <button onclick="inscrire()">S'inscrire / Se connecter</button>
